# places2go OSRM gateway — routes by profile, adds CORS headers
# /route/v1/driving/* → osrm-car:5000
# /route/v1/foot/*    → osrm-foot:5001
# All other paths      → 404 (keeps the attack surface small)

map $uri $osrm_backend {
  ~^/route/v1/driving  http://osrm-car:5000;
  ~^/route/v1/foot     http://osrm-foot:5001;
  default              "";
}

server {
  listen 80;

  # CORS preflight
  location / {
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
    add_header Access-Control-Max-Age       "86400" always;
    if ($request_method = OPTIONS) { return 204; }

    if ($osrm_backend = "") { return 404; }

    proxy_pass         $osrm_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_read_timeout 30s;
  }
}
