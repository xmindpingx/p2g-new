# places2go — Nginx site config for aaPanel
# Copyright © 2026–2027 Chris Gavan, Arizona. All rights reserved.
#
# Place this file at (or include it from):
#   /www/server/nginx/conf/vhost/places2go.conf
# Then reload: nginx -s reload
#
# Domain: p2g.signaturediversified.com
# Dist root: /www/wwwroot/places2go/dist
#
# This config:
#  1. Serves the Expo SPA from /www/wwwroot/places2go/dist
#  2. Proxies /api/bug-reports/* → localhost:3001
#  3. Proxies /api/stripe/*      → localhost:3002
#  4. Enables gzip and caching for static assets
#  5. (Optional) Redirects HTTP → HTTPS — uncomment the http block below
#     if you have a TLS cert (aaPanel's "SSL" tab handles cert issuance).

# ── HTTP (redirect to HTTPS when you have a cert) ──────────────────────────
# server {
#   listen 80;
#   server_name p2g.signaturediversified.com;
#   return 301 https://$host$request_uri;
# }

# ── HTTPS / main ────────────────────────────────────────────────────────────
server {
  listen 80;               # change to: listen 443 ssl http2;  once cert is ready
  server_name p2g.signaturediversified.com;

  # ── TLS — uncomment after running aaPanel SSL ───────────────────────────
  # ssl_certificate     /www/server/panel/vhost/cert/p2g.signaturediversified.com/fullchain.pem;
  # ssl_certificate_key /www/server/panel/vhost/cert/p2g.signaturediversified.com/privkey.pem;
  # ssl_protocols       TLSv1.2 TLSv1.3;
  # ssl_ciphers         HIGH:!aNULL:!MD5;
  # ssl_session_cache   shared:SSL:10m;
  # ssl_session_timeout 10m;
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  root  /www/wwwroot/places2go/dist;
  index index.html;

  charset utf-8;

  # ── Logging ─────────────────────────────────────────────────────────────
  access_log /www/wwwlogs/p2g.signaturediversified.com.log combined;
  error_log  /www/wwwlogs/p2g.signaturediversified.com.error.log warn;

  # ── Gzip ────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/wasm image/svg+xml;

  # ── Static asset caching ─────────────────────────────────────────────────
  # Expo hashes asset filenames → safe to cache forever
  location ~* \.(js|css|wasm|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
    expires     1y;
    add_header  Cache-Control "public, immutable";
    access_log  off;
  }

  # ── API reverse proxies ──────────────────────────────────────────────────

  # Bug-report server (port 3001)
  location /api/bug-reports {
    rewrite ^/api/bug-reports(/.*)$ $1 break;
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Screenshots can be large
    client_max_body_size 25m;
    proxy_read_timeout   60s;
  }

  # Stripe server (port 3002)
  location /api/stripe {
    rewrite ^/api/stripe(/.*)$ $1 break;
    proxy_pass         http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout   30s;
  }

  # ── Ollama (local model API) ─────────────────────────────────────────────
  # Expose Ollama through Nginx so the browser can call it on the same origin.
  # Ollama runs on 11434. Restrict access: only allow calls from the app itself.
  location /api/ollama/ {
    # Strip the /api/ollama prefix before forwarding
    rewrite ^/api/ollama/(.*)$ /$1 break;
    proxy_pass         http://127.0.0.1:11434;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Ollama streams: disable proxy buffering so tokens arrive immediately
    proxy_buffering    off;
    proxy_read_timeout 300s;
    client_max_body_size 10m;
  }

  # ── SPA fallback — ALL other paths return index.html ────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Block dot-files ──────────────────────────────────────────────────────
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
